<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="予約する前に、その席からスクリーンがどう見えるかを3Dで確かめられる映画館の座席ビュー。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0c">
<title>SEATVIEW — 予約前に座席からの見え方をチェック</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
<script src="./app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="SEATVIEW ホーム">SEAT<span>VIEW</span></a>
  <div class="film">
    <strong>夜明けの稜線</strong>
    <span>本日 19:40 · 字幕 · 118分</span>
  </div>
</header>

<main class="layout">
  <section class="viewport" id="viewport" aria-label="選んだ席から見たスクリーン">
    <canvas id="gl" aria-hidden="true"></canvas>
    <p class="nogl" id="nogl" hidden>このブラウザでは3Dプレビューを表示できません。下の数値で見え方を確認してください。</p>
    <div class="hud hud-top">
      <span class="pill" id="viewState">おすすめ席</span>
      <strong id="viewSeat">–</strong>
    </div>
    <div class="hud hud-tools" role="group" aria-label="プレビューの設定">
      <button type="button" class="tool" id="tPeople" aria-pressed="true">観客</button>
      <button type="button" class="tool" id="tHouse" aria-pressed="false">照明</button>
      <button type="button" class="tool" id="tPattern" aria-pressed="false">テストパターン</button>
      <button type="button" class="tool ghost" id="tReset" hidden>正面を向く</button>
    </div>
    <p class="hud hint" id="hint">ドラッグで見回す</p>
  </section>

  <section class="picker" aria-label="座席の選択">
    <div class="tabs" role="tablist" aria-label="スクリーン" id="tabs"></div>

    <div class="map-wrap">
      <div class="map-scroll" id="mapScroll">
        <div class="map" id="map">
          <div class="screen-arc" aria-hidden="true"><span>SCREEN</span></div>
          <div class="rows" id="rows" role="group" aria-label="座席表"></div>
        </div>
      </div>
    </div>

    <div class="map-foot">
      <ul class="legend" aria-label="凡例">
        <li><i class="sw sw-free"></i>選択可</li>
        <li><i class="sw sw-sel"></i>選択中</li>
        <li><i class="sw sw-taken"></i>予約済み</li>
        <li class="heat-legend" id="heatLegend"><i class="sw sw-grad"></i>見やすさ 低 → 高</li>
      </ul>
      <div class="map-actions">
        <button type="button" class="chip" id="tHeat" aria-pressed="true">見やすさで色分け</button>
        <button type="button" class="chip accent" id="bBest">おすすめ席を選ぶ</button>
      </div>
    </div>
  </section>

  <section class="insight" aria-label="座席の見え方分析" aria-live="polite">
    <div class="score">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring-bg" cx="32" cy="32" r="27"/>
        <circle class="ring-fg" id="ring" cx="32" cy="32" r="27" transform="rotate(-90 32 32)"/>
      </svg>
      <div class="score-num"><b id="scoreNum">–</b><small>点</small></div>
    </div>
    <div class="verdict">
      <p class="grade" id="grade">–</p>
      <p class="say" id="say"></p>
    </div>
    <dl class="metrics">
      <div><dt>スクリーンまで</dt><dd><b id="mDist">–</b><span id="mDistTag"></span></dd></div>
      <div><dt>画面が占める視野</dt><dd><b id="mH">–</b><span id="mHTag"></span></dd></div>
      <div><dt>見上げる角度</dt><dd><b id="mV">–</b><span id="mVTag"></span></dd></div>
      <div><dt>中央からのずれ</dt><dd><b id="mO">–</b><span id="mOTag"></span></dd></div>
    </dl>
  </section>
</main>

<footer class="bar">
  <div class="bar-in">
    <div class="picked">
      <p class="picked-label" id="pickedLabel">座席を選んでください</p>
      <div class="picked-chips" id="pickedChips"></div>
    </div>
    <div class="total">
      <span id="totalCount"></span>
      <b id="totalPrice"></b>
    </div>
    <button type="button" class="cta" id="bBook" disabled>予約する</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog">
    <h2 id="dlgTitle">この座席で予約しますか？</h2>
    <dl id="dlgList"></dl>
    <p class="demo-note">デモ画面のため、実際の予約・決済は行われません。</p>
    <div class="dlg-actions">
      <button class="chip" value="cancel">選び直す</button>
      <button class="cta" value="ok">確定</button>
    </div>
  </form>
</dialog>
</body>
</html>
