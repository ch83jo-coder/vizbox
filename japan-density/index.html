<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本の人口密度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4ecdc; --ink:#3a2618; --muted:#8a6f58; --line:#c8ad8d;
  --low:#f2b66e; --mid:#d9853b; --high:#4a2b1a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1611; --ink:#f1e2cc; --muted:#a58b72; --line:#5b4636;
    --low:#b9763a; --mid:#e59a4c; --high:#ffe0b0;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1611; --ink:#f1e2cc; --muted:#a58b72; --line:#5b4636;
  --low:#b9763a; --mid:#e59a4c; --high:#ffe0b0;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;left:20px;top:16px;pointer-events:none;max-width:70%}
h1{margin:0;font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:-0.02em;line-height:1.15}
header p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.label{position:absolute;transform:translate(-50%,-100%);font-size:15px;font-weight:500;
  color:var(--ink);white-space:nowrap;pointer-events:none;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
.label.sm{font-size:13px}
#legend{position:absolute;right:20px;bottom:18px;font-size:12px;color:var(--muted);width:180px}
#legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high));margin:6px 0 4px}
#legend .ticks{display:flex;justify-content:space-between}
#hint{position:absolute;left:20px;bottom:18px;font-size:12px;color:var(--muted);max-width:45%}
@media (max-width:560px){
  #legend{width:140px;right:14px}
  #hint{left:14px}
  header{left:14px}
  .label{font-size:13px}.label.sm{font-size:11px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="日本の人口密度 3Dマップ"></canvas>
  <header>
    <h1>日本の人口密度</h1>
    <p>2015年国勢調査の市区町村人口を約5kmメッシュに配分した推計値</p>
  </header>
  <div id="labels"></div>
  <div id="hint">1本指で回転、2本指で拡大・移動</div>
  <div id="legend">
    <div>1km²あたりの人口</div>
    <div class="bar"></div>
    <div class="ticks"><span>400</span><span>1万</span><span>2.9万</span></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
fetch('./data.json').then(r=>r.json()).then(DATA=>{
  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(32,1,1,3000);
  const K=10, LNG0=137.2, LAT0=37.0, CS=Math.cos(37*Math.PI/180);
  const px=lng=>(lng-LNG0)*CS*K, pz=lat=>-(lat-LAT0)*K;

  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function palette(){return{bg:new THREE.Color(css('--bg')),line:new THREE.Color(css('--line')),
    low:new THREE.Color(css('--low')),mid:new THREE.Color(css('--mid')),high:new THREE.Color(css('--high'))}}
  let P=palette();

  // outlines
  const lineMat=new THREE.LineBasicMaterial({color:P.line});
  const outline=new THREE.Group();
  for(const L of DATA.lines){
    const pts=[];for(let i=0;i<L.length;i+=2)pts.push(new THREE.Vector3(px(L[i]),0,pz(L[i+1])));
    outline.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
  }
  // Okinawa inset frame
  {const a=[[141.7,30.9],[149.1,30.9],[149.1,36.1],[141.7,36.1]].map(p=>new THREE.Vector3(px(p[0]),0,pz(p[1])));
   const f=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(a),new THREE.LineDashedMaterial({color:P.line,dashSize:1,gapSize:0.8}));
   f.computeLineDistances();outline.add(f);}
  scene.add(outline);

  // bars
  const C=DATA.cells, N=C.length/3, HMAX=46;let MAXD=0;for(let i=2;i<C.length;i+=3)MAXD=Math.max(MAXD,C[i]);
  const geo=new THREE.BoxGeometry(0.40,1,0.41);geo.translate(0,0.5,0);
  const mat=new THREE.MeshLambertMaterial({color:0xffffff});
  const mesh=new THREE.InstancedMesh(geo,mat,N);
  const heights=new Float32Array(N), pos=new Float32Array(N*2);
  const col=new THREE.Color();
  function colorFor(d){
    const t=Math.min(1,Math.pow(d/MAXD,0.6));
    if(t<0.45) return col.copy(P.low).lerp(P.mid,t/0.45);
    return col.copy(P.mid).lerp(P.high,(t-0.45)/0.55);
  }
  for(let i=0;i<N;i++){
    const lng=C[i*3],lat=C[i*3+1],d=C[i*3+2];
    pos[i*2]=px(lng);pos[i*2+1]=pz(lat);
    heights[i]=Math.max(0.15,d/MAXD*HMAX);
    mesh.setColorAt(i,colorFor(d));
  }
  scene.add(mesh);
  const amb=new THREE.AmbientLight(0xffffff,0.62);scene.add(amb);
  const dir=new THREE.DirectionalLight(0xffffff,0.55);dir.position.set(-40,80,60);scene.add(dir);
  const dir2=new THREE.DirectionalLight(0xffffff,0.18);dir2.position.set(60,30,-40);scene.add(dir2);

  const m4=new THREE.Matrix4();
  function setGrowth(g){
    for(let i=0;i<N;i++){
      // taller bars finish slightly later for a rising skyline
      const h=heights[i]*g;
      m4.makeScale(1,Math.max(0.001,h),1);m4.setPosition(pos[i*2],0,pos[i*2+1]);
      mesh.setMatrixAt(i,m4);
    }
    mesh.instanceMatrix.needsUpdate=true;
  }

  // labels (Okinawa inset shifted +7 lat, +19 lng)
  const cities=[["東京",139.72,35.70,1],["大阪",135.50,34.69,1],["名古屋",136.91,35.17,1],
    ["札幌",141.35,43.06,1],["福岡",130.40,33.59,1],["仙台",140.88,38.27,0],["広島",132.46,34.40,0],
    ["京都",135.77,35.01,0],["神戸",135.18,34.69,0],["那覇",127.68+19.0,26.21+7.0,0],["沖縄",147.7,35.3,-1]];
  const box=document.getElementById('labels');
  const labels=cities.map(([n,lng,lat,big])=>{
    const el=document.createElement('div');el.className='label'+(big>0?'':' sm');el.textContent=n;box.appendChild(el);
    const x=px(lng),z=pz(lat);let top=0;
    if(big>=0){for(let i=0;i<N;i++){const dx=pos[i*2]-x,dz=pos[i*2+1]-z;if(dx*dx+dz*dz<2.5)top=Math.max(top,heights[i]);}}
    return{el,v:new THREE.Vector3(x,top+1.2,z)};
  });

  const controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=40;controls.maxDistance=600;
  controls.target.set(px(138.4),4,pz(35.2));

  function fit(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
    const portrait=w/h<0.9;
    const t=controls.target;
    if(portrait){t.set(px(137.8),4,pz(34.8));const dist=Math.min(720,215/Math.max(camera.aspect,0.4));
      camera.position.set(t.x-dist*0.05,t.y+dist*0.78,t.z+dist*0.62);}
    else{const dist=215;camera.position.set(t.x+dist*0.30,t.y+dist*0.50,t.z+dist*0.81);}
    controls.update();
  }
  window.addEventListener('resize',()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();});

  const v=new THREE.Vector3();
  function placeLabels(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    for(const L of labels){v.copy(L.v).project(camera);
      const vis=v.z<1&&v.x>-1.1&&v.x<1.1&&v.y>-1.1&&v.y<1.1;
      L.el.style.display=vis?'block':'none';
      L.el.style.left=((v.x+1)/2*w)+'px';L.el.style.top=((1-v.y)/2*h)+'px';}
  }

  function applyTheme(){P=palette();scene.background=P.bg;lineMat.color=P.line;
    for(let i=0;i<N;i++)mesh.setColorAt(i,colorFor(C[i*3+2]));mesh.instanceColor.needsUpdate=true;}
  applyTheme();
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}

  fit();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0=performance.now(),DUR=reduce?0:1800;let done=false;
  setGrowth(reduce?1:0);
  function loop(now){
    if(!done){const g=DUR?Math.min(1,(now-t0)/DUR):1;const e=1-Math.pow(1-g,3);setGrowth(e);if(g>=1)done=true;}
    controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
